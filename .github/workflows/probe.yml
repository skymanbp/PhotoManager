name: probe
on: [workflow_dispatch, push]
jobs:
  acl:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $sig = @'
          [DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern uint GetFileAttributesW(string p);
          [DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr CreateFileW(string p, uint access, uint share, IntPtr sa, uint disp, uint flags, IntPtr t);
          [DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr FindFirstFileW(string p, IntPtr fd);
          '@
          $k = Add-Type -MemberDefinition $sig -Name K -Namespace P -PassThru
          $fd = [Runtime.InteropServices.Marshal]::AllocHGlobal(2048)
          foreach ($root in @("$env:TEMP\d", "$env:RUNNER_TEMP\d", "D:\a\PhotoManager\PhotoManager\d")) {
            "##### root $root"
            New-Item -ItemType Directory -Force "$root\sub" | Out-Null
            "x" | Set-Content "$root\sub\a.txt"; "x" | Set-Content "$root\f.txt"
            icacls "$root\sub" /deny "${env:USERNAME}:(RD)" | Out-Null
            icacls "$root\f.txt" /deny "${env:USERNAME}:(F)" | Out-Null
            (Get-Acl "$root\f.txt").Owner
            foreach ($p in @("$root\f.txt", "$root\sub", "$root\sub\a.txt", "$root\nonexist")) {
              $a = $k::GetFileAttributesW($p); $e = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              $h = $k::CreateFileW($p, [uint32]0, [uint32]7, [IntPtr]::Zero, [uint32]3, [uint32]0x02000000, [IntPtr]::Zero); $e2 = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              $h3 = $k::CreateFileW($p, [uint32]2147483648, [uint32]7, [IntPtr]::Zero, [uint32]3, [uint32]0x02000000, [IntPtr]::Zero); $e3 = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              $h4 = $k::FindFirstFileW("$p\*", $fd); $e4 = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              "$($p.Split('\')[-1]): GetFileAttributes err=$e | CreateFile(0,BACKUP) err=$e2 | CreateFile(GENERIC_READ) err=$e3 | FindFirstFile(p\*) err=$e4"
            }
          }
          exit 0
