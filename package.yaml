name: photo-manager
version: 0.4.7
synopsis: Safety-first photo library manager (pm)
description: See docs/DESIGN.md
license: Apache-2.0
language: GHC2021

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wredundant-constraints

dependencies:
- base >= 4.20 && < 5
- aeson
- ansi-terminal
- async
- bytestring
- containers
- crypton
- directory
- filepath
- optparse-applicative
- text
- time
- toml-reader
- Win32
# P4-1 pm serve（DESIGN §11：127.0.0.1 loopback JSON API）
- http-types
- memory
- network
- process
- wai
- warp

library:
  source-dirs: src
  c-sources: cbits/pm_win.c

executables:
  pm:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - photo-manager

tests:
  pm-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    dependencies:
    - photo-manager
    - process
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - temporary
    - http-types
    - wai
    - wai-extra
